name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            zig_target: x86_64-linux
            zig_sha: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            just_target: x86_64-unknown-linux-musl
            just_sha: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          - os: macos-latest
            zig_target: aarch64-macos
            zig_sha: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            just_target: aarch64-apple-darwin
            just_sha: 50ae3e996c974a0bf32ea7d10f495070df33f1b43e0616b2769e3d4821ed8f48
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/tools/zig .tmp/tools/just
          curl --fail --location --retry 3 'https://ziglang.org/download/0.16.0/zig-${{ matrix.zig_target }}-0.16.0.tar.xz' --output .tmp/tools/zig.tar.xz
          printf '%s  %s\n' '${{ matrix.zig_sha }}' '.tmp/tools/zig.tar.xz' | shasum -a 256 --check
          tar -xJf .tmp/tools/zig.tar.xz --strip-components=1 -C .tmp/tools/zig
          curl --fail --location --retry 3 'https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-${{ matrix.just_target }}.tar.gz' --output .tmp/tools/just.tar.gz
          printf '%s  %s\n' '${{ matrix.just_sha }}' '.tmp/tools/just.tar.gz' | shasum -a 256 --check
          tar -xzf .tmp/tools/just.tar.gz -C .tmp/tools/just
          printf '%s\n' "$PWD/.tmp/tools/zig" "$PWD/.tmp/tools/just" >> "$GITHUB_PATH"
          if ! command -v pkg-config >/dev/null; then
            brew install pkgconf
          fi
          command -v pkg-config

      # The native build cache key covers every input of `just native` that
      # the restored files depend on:
      # - matrix.zig_sha: the Zig binary that compiled them.
      # - scripts/native.sh: the Ghostty revision, archive SHA-256, Zig
      #   version and zig build flags.
      # - the root, target, prefix and cache names the justfile passes to the
      #   script: the root's absolute path is part of Zig's cache manifests.
      # - the host target from `zig targets`: CPU model, features and OS
      #   version. The archive's code does not depend on it (Ghostty replaces
      #   macOS `native` with a generic macOS 13.0 target, and the Linux
      #   target is explicit), but Ghostty's Unicode table generators compile
      #   for the host, and Zig 0.16.0's `zig build` has no option that pins
      #   the host. Zig's cache digests include the target and the paths of
      #   generated files, so a cache restored on another host rebuilds the
      #   library. With the host in the key, each new runner image kernel or
      #   macOS version, and each CPU model, costs one full build and saves
      #   one entry. The step prints the host block so a miss can be traced
      #   to the field that changed.
      - name: Resolve native build cache inputs
        id: native
        shell: bash
        run: |
          set -euo pipefail
          root=$(just --evaluate native_root)
          target=$(just --evaluate native_target)
          prefix=$(just --evaluate native_prefix_name)
          cache=$(just --evaluate native_cache_name)
          host=$(zig targets | sed -n '/^    \.native = \.{$/,$p')
          test -n "$host" || { printf 'zig targets printed no native target.\n' >&2; exit 1; }
          printf 'Host target in the cache key:\n%s\n' "$host"
          digest=$(printf '%s\n' "$root" "$target" "$prefix" "$cache" "$host" | shasum -a 256)
          {
            printf 'prefix=%s\n' "$prefix"
            printf 'cache=%s\n' "$cache"
            printf 'digest=%s\n' "${digest%% *}"
          } >> "$GITHUB_OUTPUT"

      # Restores the extracted source, which carries its revision marker, the
      # installed prefix and both Zig caches, so `just native` neither
      # downloads the archive nor recompiles. There are no restore-keys: a
      # key ending at `-inputs-` would restore another host's entry for the
      # same revision, which saves only the download and the package fetch,
      # since the library still rebuilds, and the entry saved afterwards
      # would hold both hosts' cache objects. The action saves only after a
      # successful job, and only when no entry exists for the key.
      - name: Restore native build cache
        uses: actions/cache@v6
        with:
          path: |
            .tmp/native/ghostty
            .tmp/native/${{ steps.native.outputs.prefix }}
            .tmp/native/${{ steps.native.outputs.cache }}
            .tmp/native/zig-global-cache
          key: native-${{ runner.os }}-${{ runner.arch }}-zig-${{ matrix.zig_sha }}-script-${{ hashFiles('scripts/native.sh') }}-inputs-${{ steps.native.outputs.digest }}

      - name: Verify module hygiene, build, vet, and race tests
        run: just check

      - name: Verify standalone binary linkage
        run: just linkage
